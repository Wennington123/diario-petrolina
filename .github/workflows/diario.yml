name: diario-petrolina

on:
  schedule:
    - cron: "17 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar diário e enviar ao Discord
        run: python3 diario.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Salvar estado
        run: |
          git config user.name "bot-diario"
          git config user.email "bot-diario@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "ultimo diario enviado" && git push)
